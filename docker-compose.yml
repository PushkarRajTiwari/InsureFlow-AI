services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insureflow
      POSTGRES_USER: insureflow
      POSTGRES_PASSWORD: insureflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureflow -d insureflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=insureflow;Username=insureflow;Password=insureflow
      Frontend__Url: http://localhost:3000
      Jwt__Issuer: InsureFlowAI
      Jwt__Audience: InsureFlowAI
      Jwt__Secret: ${JWT_SECRET}
      Encryption__Key: ${ENCRYPTION_KEY}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Google__RedirectUri: postmessage
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
